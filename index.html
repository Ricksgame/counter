
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube リアルタイムカウンター</title>

    <style>
        :root {
            --yt-red: #ff0000;
            --bg-color: #0f0f0f;
            --card-bg: #212121;
            --text-main: #f1f1f1;
            --text-sub: #aaa;
            --border-color: #3d3d3d;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: "YouTube Sans", "Roboto", "Arial", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .setup-box {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            width: 100%;
            max-width: 500px;
            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-size: 0.9rem;
            color: var(--text-sub);
            margin-bottom: 5px;
        }

        input {
            width: 100%;
            padding: 12px;
            background-color: #121212;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-main);
            font-size: 1rem;
        }

        input:focus {
            outline: none;
            border-color: var(--yt-red);
        }

        .btn {
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn:hover {
            opacity: 0.85;
        }

        .start-btn {
            background-color: var(--yt-red);
        }

        .stop-btn {
            background-color: #555;
            margin-top: 10px;
        }

        .counter-card {
            background-color: var(--card-bg);
            padding: 40px 20px;
            border-radius: 12px;
            width: 100%;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
            display: none;
        }

        .thumbnail {
            width: 120px;
            height: 120px;
            object-fit: cover;
            border-radius: 50%;
            margin-bottom: 15px;
            border: 3px solid var(--yt-red);
        }

        .video-title {
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 8px;
            overflow-wrap: anywhere;
        }

        .channel-title {
            font-size: 1rem;
            color: var(--text-sub);
            margin-bottom: 25px;
        }

        .view-label {
            font-size: 0.85rem;
            letter-spacing: 2px;
            color: var(--yt-red);
            font-weight: bold;
            margin-bottom: 5px;
        }

        .view-count {
            font-size: clamp(2rem, 10vw, 3.5rem);
            font-weight: bold;
            font-family: "Courier New", Courier, monospace;
            letter-spacing: -1px;
            margin-bottom: 10px;
            overflow-wrap: anywhere;
        }

        .status {
            font-size: 0.8rem;
            color: var(--text-sub);
            line-height: 1.8;
        }

        .error {
            color: var(--yt-red);
            font-weight: bold;
            margin-top: 10px;
            text-align: center;
            overflow-wrap: anywhere;
        }

        .note {
            color: var(--text-sub);
            font-size: 0.8rem;
            line-height: 1.6;
            margin-top: 15px;
        }
    </style>
</head>

<body>

    <!-- 設定エリア -->
    <div class="setup-box">

        <div class="input-group">
            <label for="api-key">YouTube Data API キー</label>
            <input
                type="password"
                id="api-key"
                placeholder="AIzaSy..."
                autocomplete="off"
            >
        </div>

        <div class="input-group">
            <label for="video-url">YouTubeの動画URL または 動画ID</label>
            <input
                type="text"
                id="video-url"
                placeholder="https://www.youtube.com/watch?v=..."
            >
        </div>

        <button
            type="button"
            class="btn start-btn"
            id="start-btn"
            onclick="startCounter()"
        >
            カウンターを起動する
        </button>

        <button
            type="button"
            class="btn stop-btn"
            onclick="stopCounter()"
        >
            カウンターを停止する
        </button>

        <div id="error-message" class="error" role="alert"></div>

        <div class="note">
            ※ 視聴回数はYouTube Data APIから取得します。<br>
            ※ 更新間隔は10秒です。
        </div>

    </div>


    <!-- カウンター表示エリア -->
    <div id="counter-card" class="counter-card">

        <img
            id="video-thumb"
            class="thumbnail"
            src=""
            alt="動画サムネイル"
            style="display:none;"
        >

        <div id="video-title" class="video-title">
            動画タイトル
        </div>

        <div id="channel-title" class="channel-title">
            チャンネル名
        </div>

        <div class="view-label">
            TOTAL VIEWS
        </div>

        <div id="view-count" class="view-count">
            0
        </div>

        <div id="status" class="status">
            待機中
        </div>

    </div>


    <script>

        // タイマー管理用
        let timer = null;

        // 通信中かどうかを管理する
        let isFetching = false;

        // 動画IDを保存する
        let currentVideoId = null;


        // ========================================
        // 動画IDを抽出する関数
        // ========================================

        function extractVideoId(input) {

            const value = input.trim();

            // 動画IDを直接入力した場合
            if (/^[a-zA-Z0-9_-]{11}$/.test(value)) {
                return value;
            }

            try {

                // URLの形式を確認する
                const url = new URL(
                    value.includes("://") ? value : "https://" + value
                );

                const host = url.hostname.toLowerCase();

                let videoId = null;

                // youtu.be形式
                if (host === "youtu.be") {

                    videoId = url.pathname.split("/").filter(Boolean)[0];

                }

                // YouTube形式
                else if (
                    host === "youtube.com" ||
                    host.endsWith(".youtube.com")
                ) {

                    // 通常の動画URL
                    if (url.pathname === "/watch") {

                        videoId = url.searchParams.get("v");

                    }

                    // Shorts・埋め込み・ライブ配信
                    else if (
                        /^\/(shorts|embed|live|v)\//.test(url.pathname)
                    ) {

                        videoId = url.pathname.split("/")[2];

                    }

                }

                // 動画IDの形式を検証する
                if (
                    videoId &&
                    /^[a-zA-Z0-9_-]{11}$/.test(videoId)
                ) {

                    return videoId;

                }

                return null;

            } catch (error) {

                return null;

            }

        }


        // ========================================
        // YouTube APIから動画情報を取得する関数
        // ========================================

        async function fetchStats() {

            // すでに通信中なら重複実行しない
            if (isFetching) {
                return;
            }

            const apiKey = document
                .getElementById("api-key")
                .value
                .trim();

            const videoInput = document
                .getElementById("video-url")
                .value
                .trim();

            const errorDiv = document.getElementById("error-message");

            const statusDiv = document.getElementById("status");


            // APIキーの入力チェック
            if (!apiKey) {

                errorDiv.innerText = "APIキーを入力してください。";

                stopCounter();

                return;

            }


            // 動画URLの入力チェック
            if (!videoInput) {

                errorDiv.innerText = "動画URLまたはIDを入力してください。";

                stopCounter();

                return;

            }


            // 動画IDを取得する
            const videoId = extractVideoId(videoInput);


            // 動画IDのチェック
            if (!videoId) {

                errorDiv.innerText =
                    "動画IDが正しくありません。URLまたはIDを確認してください。";

                stopCounter();

                return;

            }


            // 通信開始
            isFetching = true;

            errorDiv.innerText = "";

            statusDiv.innerText = "データを取得しています...";


            try {

                // APIのURLを作成する
                const params = new URLSearchParams({

                    part: "snippet,statistics",

                    id: videoId,

                    key: apiKey

                });

                const apiUrl =
                    `https://www.googleapis.com/youtube/v3/videos?${params}`;


                // APIにリクエストを送信する
                const response = await fetch(apiUrl);


                // JSON形式でデータを取得する
                const data = await response.json();


                // HTTPエラーの確認
                if (!response.ok) {

                    const message =
                        data.error?.message ||
                        `HTTPエラー: ${response.status}`;

                    throw new Error(message);

                }


                // APIエラーの確認
                if (data.error) {

                    throw new Error(data.error.message);

                }


                // 動画が存在するか確認
                if (!data.items || data.items.length === 0) {

                    throw new Error(
                        "動画が見つかりませんでした。動画IDや公開状態を確認してください。"
                    );

                }


                // 動画情報を取得する
                const video = data.items[0];


                // 必要な情報が存在するか確認
                if (!video.snippet || !video.statistics) {

                    throw new Error(
                        "動画情報を正しく取得できませんでした。"
                    );

                }


                // ========================================
                // 動画タイトルを表示
                // ========================================

                document.getElementById("video-title").innerText =
                    video.snippet.title;


                // ========================================
                // チャンネル名を表示
                // ========================================

                document.getElementById("channel-title").innerText =
                    video.snippet.channelTitle;


                // ========================================
                // 視聴回数を表示
                // ========================================

                const viewCount = Number(
                    video.statistics.viewCount
                );

                if (!Number.isSafeInteger(viewCount)) {

                    throw new Error(
                        "視聴回数を正しく取得できませんでした。"
                    );

                }

                document.getElementById("view-count").innerText =
                    viewCount.toLocaleString("ja-JP");


                // ========================================
                // サムネイルを表示
                // ========================================

                const thumbImg =
                    document.getElementById("video-thumb");

                const thumbnails = video.snippet.thumbnails;

                const thumbnail =
                    thumbnails.high ||
                    thumbnails.medium ||
                    thumbnails.default;

                if (thumbnail?.url) {

                    thumbImg.onerror = function () {

                        this.style.display = "none";

                    };

                    thumbImg.src = thumbnail.url;

                    thumbImg.style.display = "inline-block";

                } else {

                    thumbImg.style.display = "none";

                }


                // ========================================
                // カウンターカードを表示
                // ========================================

                document.getElementById("counter-card")
                    .style.display = "block";


                // 最終更新時刻
                const now = new Date();

                const time = now.toLocaleTimeString("ja-JP");

                statusDiv.innerText =
                    `自動更新中（5秒ごと）\n最終更新：${time}`;


                // 現在の動画IDを保存
                currentVideoId = videoId;


            } catch (error) {

                // エラーを表示
                errorDiv.innerText =
                    `エラー：${error.message}`;

                statusDiv.innerText =
                    "更新を停止しました。";


                // エラーが発生したらタイマーを停止
                stopCounter(false);


            } finally {

                // 通信終了
                isFetching = false;

            }

        }


        // ========================================
        // カウンターを起動する関数
        // ========================================

        function startCounter() {

            // 以前のタイマーを停止する
            if (timer !== null) {

                clearInterval(timer);

                timer = null;

            }


            // エラー表示を消す
            document.getElementById("error-message").innerText = "";


            // 前回の情報を整理する
            document.getElementById("counter-card")
                .style.display = "none";


            // 動画情報を取得する
            fetchStats();


            // 5秒ごとに更新する
            timer = setInterval(function () {

                fetchStats();

            }, 5000);

        }


        // ========================================
        // カウンターを停止する関数
        // ========================================

        function stopCounter(updateStatus = true) {

            // タイマーが存在する場合
            if (timer !== null) {

                clearInterval(timer);

                timer = null;

            }


            // 停止状態を表示する
            if (updateStatus) {

                document.getElementById("status").innerText =
                    "カウンターは停止しています。";

            }

        }


    </script>

</body>
</html>
